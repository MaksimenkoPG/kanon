name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  spec:
    name: ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.7'
            os: ubuntu-22.04
          - ruby: '3.0'
            os: ubuntu-22.04
          - ruby: '3.1'
            os: ubuntu-latest
          - ruby: '3.2'
            os: ubuntu-latest
          - ruby: '3.3'
            os: ubuntu-latest
          - ruby: '3.4'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop

  psych:
    name: psych ${{ matrix.psych }} on ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    env:
      PSYCH_VERSION: ${{ matrix.psych }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - psych: '3.3.4'
            ruby: '2.7'
            os: ubuntu-22.04
          - psych: '5.5.0'
            ruby: '3.4'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install the psych the positional branch needs
        if: matrix.ruby == '2.7'
        run: gem install psych --version 3.0.3 --no-document
      - run: bundle install --jobs 4
      - run: bundle exec rspec
